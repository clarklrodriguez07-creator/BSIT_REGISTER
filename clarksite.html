<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ClarkSite - Roblox Profile Showcase</title>

    <style>
      body {
        background-color: #fff0f5;
        font-family: Arial, sans-serif;
        margin: 0;
        padding: 40px 20px;
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
        box-sizing: border-box;
        color: #4a4a4a;
      }

      .card {
        background-color: white;
        border-radius: 20px;
        padding: 35px;
        max-width: 550px;
        width: 100%;
        box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
        border: 2px solid #ffe4e1;
        text-align: center;
        box-sizing: border-box;
        animation: appear 1s ease;
      }

      @keyframes appear {
        from {
          opacity: 0;
          transform: translateY(25px);
        }

        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      .avatar-box {
        width: 130px;
        height: 130px;
        border-radius: 50%;
        background-color: #ffe4e1;
        margin: 0 auto 15px;
        border: 4px solid #ff69b4;
        overflow: hidden;
        display: flex;
        align-items: center;
        justify-content: center;
        box-shadow: 0 4px 10px rgba(255, 105, 180, 0.3);
      }

      .avatar-box img {
        width: 100%;
        height: 100%;
        object-fit: cover;
        transition: transform 0.4s ease;
      }

      .avatar-box img:hover {
        transform: scale(1.1);
      }

      h1 {
        color: #ff69b4;
        margin: 10px 0 5px;
        font-size: 26px;
        text-shadow: 2px 2px 4px rgba(255, 105, 180, 0.3);
      }

      .username {
        color: #777777;
        font-size: 14px;
        margin-bottom: 15px;
      }

      .badge {
        display: inline-block;
        background-color: #fff0f5;
        color: #ff69b4;
        padding: 7px 14px;
        border-radius: 20px;
        font-size: 12px;
        font-weight: bold;
        margin-bottom: 20px;
      }

      .stats-container {
        display: flex;
        justify-content: space-around;
        background-color: #fff0f5;
        padding: 15px;
        border-radius: 16px;
        margin-bottom: 20px;
        border: 1px solid #ffe4e1;
      }

      .stat-item h3 {
        margin: 0;
        color: #ff69b4;
        font-size: 18px;
      }

      .stat-item p {
        margin: 5px 0 0;
        font-size: 12px;
        color: #777777;
      }

      .showcase-frame {
        width: 100%;
        height: 220px;
        border-radius: 16px;
        border: 2px dashed #ffb6c1;
        background-color: #fff0f5;
        margin-bottom: 20px;
        overflow: hidden;
        display: flex;
        align-items: center;
        justify-content: center;
        box-sizing: border-box;
      }

      .showcase-frame img {
        width: 100%;
        height: 100%;
        object-fit: cover;
        transition: transform 0.4s ease;
      }

      .showcase-frame img:hover {
        transform: scale(1.1);
      }

      .actions {
        display: flex;
        flex-direction: column;
        gap: 12px;
      }

      .btn {
        display: inline-block;
        padding: 12px;
        border: none;
        border-radius: 25px;
        background-color: #ff69b4;
        color: white;
        font-weight: bold;
        text-decoration: none;
        cursor: pointer;
        box-shadow: 0 4px 10px rgba(255, 105, 180, 0.25);
        transition:
          background-color 0.3s ease,
          transform 0.3s ease,
          box-shadow 0.3s ease;
      }

      .btn:hover {
        background-color: #ff1493;
        color: white;
        transform: translateY(-3px);
        box-shadow: 0 6px 14px rgba(255, 105, 180, 0.4);
      }

      .btn-outline {
        background-color: transparent;
        border: 2px solid #ffb6c1;
        color: #ff69b4;
      }

      .btn-outline:hover {
        background-color: #fff0f5;
        color: #ff69b4;
      }

      @media (max-width: 600px) {
        body {
          padding: 20px 10px;
        }

        .card {
          padding: 20px;
        }

        h1 {
          font-size: 24px;
        }

        .avatar-box {
          width: 110px;
          height: 110px;
        }

        .showcase-frame {
          height: 180px;
        }

        .stats-container {
          padding: 12px 5px;
        }
      }
    </style>
  </head>

  <body>
    <div class="card">
      <div class="avatar-box">
        <img src="images/profile.jpg" alt="Clark's Profile Picture" />
      </div>

      <h1>Sune</h1>
      <div class="username">@Sunemeko</div>
      <span class="badge">🎮 Roblox Profile Showcase</span>

      <div class="stats-container">
        <div class="stat-item">
          <h3>250+</h3>
          <p>Friends</p>
        </div>

        <div class="stat-item">
          <h3>1.2K</h3>
          <p>Followers</p>
        </div>

        <div class="stat-item">
          <h3>15</h3>
          <p>Badges</p>
        </div>
      </div>

      <div class="showcase-frame">
        <img src="images/roblox-showcase.png" alt="Clark's Roblox Screenshot" />
      </div>

      <div class="actions">
        <a
          href="https://www.roblox.com"
          target="_blank"
          rel="noopener noreferrer"
          class="btn"
        >
          Open Official Roblox Site 🚀
        </a>

        <a href="clarkhtml.html" class="btn btn-outline">
          ← Back to Biography
        </a>
      </div>
    </div>
  </body>
</html>
