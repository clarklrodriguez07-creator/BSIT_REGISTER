<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Hobbies & Interests - Clark</title>

    <style>
      body {
        font-family: Arial, sans-serif;
        background-color: #fff0f5;
        margin: 0;
        padding: 40px 20px;
        color: #4a4a4a;
      }

      .main-content {
        background-color: white;
        max-width: 900px;
        margin: 30px auto;
        padding: 35px;
        border: 2px solid #ffe4e1;
        border-radius: 20px;
        box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
        animation: appear 1s ease;
      }

      @keyframes appear {
        from {
          opacity: 0;
          transform: translateY(25px);
        }

        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      h1 {
        color: #ff69b4;
        text-align: center;
        text-shadow: 2px 2px 4px rgba(255, 105, 180, 0.4);
        margin-bottom: 30px;
      }

      h2 {
        color: #ff69b4;
        text-align: center;
        border-bottom: 2px dashed #ffb6c1;
        padding-bottom: 10px;
      }

      p {
        text-align: center;
        line-height: 1.8;
        margin-bottom: 20px;
      }

      .button-container {
        text-align: center;
        margin-top: 25px;
      }

      .btn-link {
        display: inline-block;
        background-color: #ff69b4;
        color: white;
        text-decoration: none;
        padding: 12px 24px;
        border-radius: 25px;
        font-size: 14px;
        font-weight: bold;
        box-shadow: 0 4px 10px rgba(255, 105, 180, 0.25);
        transition:
          background-color 0.3s ease,
          transform 0.3s ease,
          box-shadow 0.3s ease;
      }

      .btn-link:hover {
        background-color: #ff1493;
        transform: translateY(-3px);
        box-shadow: 0 6px 14px rgba(255, 105, 180, 0.4);
      }

      hr {
        border: none;
        border-top: 2px solid #ffe4e1;
        margin: 30px 0;
      }

      @media (max-width: 600px) {
        body {
          padding: 20px 10px;
        }

        .main-content {
          padding: 20px;
        }

        h1 {
          font-size: 24px;
        }
      }
    </style>
  </head>

  <body>
    <main class="main-content">
      <h1>MY HOBBIES AND INTERESTS</h1>

      <p>
        My hobbies include gaming, coding, watching AI content (wolfwolf,
        dragon, etc.), and reading Chinese web novels for more than 3 years.
        <br /><br />
        I also enjoy discovering and learning new things about
        <em>technology and computers.</em>
      </p>

      <hr />

      <div class="button-container">
        <a href="clarkhtml.html" class="btn-link"> ← Back to Main Biography </a>
      </div>
    </main>
  </body>
</html>
